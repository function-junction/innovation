<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mr. Effie — AI Math Tutor</title>
<style>
/* ai-assistant core styles - English only comments */
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh}
body{
  color:#102033;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 14% 12%, rgba(255,218,126,0.46), transparent 26rem),
    radial-gradient(circle at 86% 10%, rgba(118,216,255,0.34), transparent 24rem),
    radial-gradient(circle at 88% 72%, rgba(255,139,158,0.25), transparent 26rem),
    linear-gradient(125deg, #eafff8 0%, #fff5bf 32%, #eaf2ff 66%, #ffe9ef 100%);
  display:grid;
  place-items:center;
  padding:18px;
}
a{color:#0d6571}
.box-ok{
  border:2px solid #27ae60;
  border-radius:12px;
  padding:10px 12px;
  background-color:rgba(39,174,96,0.06);
  margin:8px 0;
}
.box-wrong{
  border:2px solid #e74c3c;
  border-radius:12px;
  padding:10px 12px;
  background-color:rgba(231,76,60,0.06);
  margin:8px 0;
}
.hint-panel{
  border:1.5px solid #05a8a8;
  border-radius:10px;
  padding:9px 11px;
  background:rgba(5,168,168,0.07);
  margin:6px 0 14px 12px;
}
.hint-panel strong{
  color:#0d6571;
}
/* Launcher and panel - original layout preserved */
.ai-launcher{
  position:fixed;right:max(18px, env(safe-area-inset-right));bottom:max(18px, env(safe-area-inset-bottom));
  z-index:20;display:flex;align-items:end;gap:10px;min-width:78px;min-height:78px;background:transparent;border:0;cursor:pointer;
}
.ai-launcher.hidden{opacity:0;transform:translateY(12px);pointer-events:none}
.ai-launcher-bubble{padding:11px 14px;border-radius:18px 18px 4px 18px;background:rgba(255,255,255,0.94);color:#354052;box-shadow:0 12px 30px rgba(74,21,51,0.18);font-weight:800;border:1px solid rgba(140,16,75,0.12)}
.ai-launcher-avatar{width:clamp(76px,5.2vw,94px);height:clamp(76px,5.2vw,94px);border-radius:50%;overflow:hidden;background:#ffe2ef;border:6px solid rgba(224,224,237,0.9);box-shadow:0 16px 36px rgba(74,21,51,0.26)}
.ai-launcher-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.ai-panel{
  position:fixed;right:22px;bottom:22px;z-index:21;
  width:min(480px, 96vw);
  max-height:min(820px, 92vh);
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto auto auto auto;
  overflow:hidden;
  border-radius:24px;
  background:#f7fbff;
  border:1px solid rgba(0,120,160,0.22);
  box-shadow:0 24px 60px rgba(16,47,74,0.26);
  opacity:0;pointer-events:none;transform:translateY(18px) scale(0.98);transition:opacity 0.22s ease, transform 0.22s ease;
}
.ai-panel.open{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.ai-panel::before{
  content:"y=e^{x}   f(x)   sin x   log_a x   x^{2}";
  position:absolute;inset:102px 0 auto;height:64px;pointer-events:none;
  color:rgba(17,78,110,0.07);font-family:Georgia,serif;font-size:1.28rem;font-weight:900;letter-spacing:0.04em;transform:rotate(-6deg);white-space:nowrap;z-index:0;
}
.ai-header{
  min-height:90px;padding:12px 14px;display:flex;align-items:center;gap:12px;
  background:radial-gradient(circle at 88% 18%, rgba(255,211,105,0.42), transparent 22%), linear-gradient(135deg, #0d4265, #069aa6 58%, #37b48b);
  color:#fff;position:relative;z-index:1;
}
.ai-avatar{width:68px;height:68px;border-radius:16px;overflow:hidden;background:#eefcff;border:2px solid rgba(255,255,255,0.72);flex:0 0 auto;box-shadow:0 6px 14px rgba(3,42,67,0.18);position:absolute;top:14px;left:14px;z-index:2}
.ai-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.ai-header-content{margin-left:84px;flex:1;padding-right:50px}
.ai-header h3{margin:0;font-size:1.16rem;line-height:1.05;font-weight:950}
.ai-header p{margin:4px 0 0;color:rgba(255,255,255,0.92);font-size:0.9rem;font-weight:700}
  .ai-badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;margin-left:5px;padding:0 6px;border-radius:7px;background:rgba(255,211,105,0.26);font-size:0.78rem;font-weight:950}
.ai-close{position:absolute;top:14px;right:14px;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,0.88);color:#0d4265;font-size:1.8rem;line-height:1;font-weight:700;border:0;cursor:pointer;z-index:3}
.chat-log{
  min-height:260px;overflow-y:auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:12px;
  background:linear-gradient(rgba(9,92,128,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(9,92,128,0.045) 1px, transparent 1px), linear-gradient(180deg, #f7fbff, #effcff);
  background-size:22px 22px,22px 22px,auto;color:#11364e;position:relative;z-index:1;
}
.msg{max-width:92%;padding:11px 13px;border-radius:15px;line-height:1.55;font-size:0.98rem;overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,0.76);border:1px solid rgba(6,154,166,0.14);color:#123852;box-shadow:0 8px 18px rgba(17,54,78,0.06)}
.msg.user{align-self:flex-end;background:linear-gradient(135deg, #d9f6ef, #c8ecff);color:#0e3c58;border:1px solid rgba(55,180,139,0.24)}
.chat-controls{margin:0 16px 16px;padding:10px;display:grid;grid-template-columns:auto 1fr 46px;gap:8px;background:#e3f5f7;border-radius:14px;border:1px solid rgba(6,154,166,0.18);position:relative;z-index:1}
.chat-controls input{min-width:0;border:0;border-radius:10px;padding:0 12px;color:#11364e;background:transparent;font-size:1rem;outline:none}
.chat-controls input::placeholder{color:rgba(17,54,78,0.55)}
#sendChat{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg, #0d72ff, #05a8a8);color:#fff;font-size:1.3rem;border:0;cursor:pointer}
/* plus button + upload dropdown menu */
.attach-plus-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#fff;border:1px solid rgba(6,154,166,0.18);color:#0d6571;font-size:1.4rem;font-weight:bold;cursor:pointer;position:relative;}
.attach-menu{position:absolute;bottom:44px;left:0;background:#ffffff;border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,0.15);min-width:140px;overflow:hidden;display:none;z-index:100;}
.attach-menu.show{display:block;}
.attach-menu button{width:100%;text-align:left;padding:10px 12px;background:#fff;border:none;font-size:0.9rem;cursor:pointer;color:#102033;}
.attach-menu button:hover{background:#e8f7f8;}
.suggestions{padding:0 16px 12px;display:flex;gap:7px;flex-wrap:wrap;background:#f7fbff;position:relative;z-index:1}
.suggestions button{background:rgba(230,250,247,0.86);color:#0d6571;border:1px solid rgba(6,154,166,0.18);border-radius:999px;padding:7px 9px;font-size:0.78rem;font-weight:800;cursor:pointer}
.ai-tabs{display:grid;grid-template-columns:1fr;min-height:48px;background:#f7fbff;border-top:1px solid rgba(6,154,166,0.18);position:relative;z-index:1}
.ai-tab{display:flex;align-items:center;justify-content:center;gap:8px;color:rgba(17,54,78,0.64);font-weight:800;background:transparent;border:0;border-top:2px solid transparent}
.ai-tab.active{color:#0d6571;border-top-color:#05a8a8}
.chat-icon{width:24px;height:20px;display:inline-block;position:relative;border:2px solid currentColor;border-radius:7px;background:rgba(255,255,255,0.66)}
.chat-icon::after{content:"";position:absolute;left:5px;bottom:-7px;width:8px;height:8px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;background:#f7fbff;transform:skew(-18deg)}
.chat-icon::before{content:"fx";position:absolute;inset:0;display:grid;place-items:center;font-size:0.58rem;line-height:1;font-weight:950}
.ai-powered{min-height:34px;display:grid;place-items:center;background:linear-gradient(90deg, #eefcff, #f8fbff);color:#557084;font-size:0.78rem;font-weight:800;position:relative;z-index:1}
  .attach-preview{padding:0 16px;display:flex;flex-wrap:wrap;gap:8px;background:#f7fbff;position:relative;z-index:1}
.attach-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:999px;background:#e3f5f7;border:1px solid rgba(6,154,166,0.18);font-size:0.74rem;font-weight:700;color:#0d4265;max-width:180px;overflow:hidden}
.attach-chip img{width:28px;height:28px;object-fit:cover;border-radius:6px;border:1px solid rgba(0,0,0,0.08)}
.attach-chip button{width:18px;height:18px;border-radius:50%;background:#0d4265;color:#fff;font-size:0.7rem;display:grid;place-items:center;border:0;flex:0 0 auto;cursor:pointer}
.msg .mark-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:0.86rem}
.msg .mark-table th,.msg .mark-table td{border:1px solid rgba(6,154,166,0.18);padding:6px 7px;text-align:left}
.msg .mark-table th{background:#e3f5f7;color:#0d4265;font-weight:800}
.msg .badge-ok{color:#0a7a42;font-weight:800}.msg .badge-wrong{color:#c0392b;font-weight:800}.msg .badge-partial{color:#b7791f;font-weight:800}
.chat-log.drag-over{outline:2px dashed #05a8a8;outline-offset:-6px;background-color:rgba(5,168,168,0.06)}
@media(max-width:560px){body{place-items:start center}}
</style>
</head>
<body>
<button class="ai-launcher" id="aiLauncher" aria-label="Open AI chatbox">
  <span class="ai-launcher-bubble">Hi! How can I assist you?</span>
  <span class="ai-launcher-avatar">
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23ffe2ef' stroke='%23ff6f91' stroke-width='4'/%3E%3Ctext x='50' y='62' text-anchor='middle' font-size='42' font-family='Georgia'%3EMr%3C/text%3E%3C/svg%3E" alt="open chat" />
  </span>
</button>
<aside class="ai-panel" id="aiPanel" aria-label="AI math teacher chatbox" aria-hidden="true">
  <div class="ai-header">
    <div class="ai-avatar">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23eefcff'/%3E%3Ctext x='50' y='58' text-anchor='middle' font-size='42' font-family='Georgia'%3EMr%3C/text%3E%3C/svg%3E" alt="Mr Effie" />
    </div>
    <div class="ai-header-content">
      <h3>Mr. Effie <span class="ai-badge">AI</span></h3>
      <p>Mathematics Learning Assistant</p>
    </div>
    <button class="ai-close" id="aiClose" aria-label="Close">×</button>
  </div>
  <div class="chat-log" id="chatLog"></div>
  <div class="attach-preview" id="attachPreview"></div>
  <div class="chat-controls">
    <div class="attach-plus-btn" id="attachPlusBtn">
      +
      <div class="attach-menu" id="attachMenu">
        <button id="menuPhoto">📷 Upload Photo</button>
        <button id="menuFile">📄 Upload File</button>
      </div>
    </div>
    <input id="chatInput" type="text" placeholder="Type here — or attach photo/file" aria-label="Type your question" />
    <button id="sendChat" title="Send">↑</button>
  </div>
  <div class="suggestions">
    <button data-prompt="Explain this slide simply.">Explain simply</button>
    <button data-prompt="Give me an example.">Example</button>
    <button data-prompt="How do I find domain and range?">Domain &amp; range</button>
  </div>
  <div class="ai-tabs"><button class="ai-tab active" type="button"><span class="chat-icon"></span><span>Chat</span></button></div>
  <div class="ai-powered">Powered by FUNCTION JUNCTION</div>
</aside>
<input type="file" id="photoInput" accept="image/*" hidden />
<input type="file" id="fileInput" accept=".pdf,.txt,.docx,image/*" hidden />
<script>
// ===================== LOCAL TEST ONLY =====================
const API_URL = '/api/gemini';
// System Instruction
const SYSTEM_PROMPT = `You are Mr. Effie, friendly mathematics tutor for students.
Strict rules:
1. NEVER give full final answers, NEVER write complete step‑by‑step solutions.
2. Provide only guiding hints, point out mistakes, explain why something is wrong, use guiding questions to push student to think on their own.
3. Handle text questions, hand‑written homework photos, function graph sketching, domain and range tasks.
4. Keep replies natural and flexible, avoid rigid template tables.
5. When you receive uploaded image of student work: analyze their work, identify errors, provide correction hints.
6. Use simple plain English, speak using second‑person "you".
7. Do NOT output raw internal marking scheme data to chat output. Use marking knowledge internally for reasoning.;

window.el = {
  aiPanel: document.getElementById('aiPanel'),
  aiLauncher: document.getElementById('aiLauncher'),
  aiClose: document.getElementById('aiClose'),
  chatLog: document.getElementById('chatLog'),
  chatInput: document.getElementById('chatInput'),
  sendChat: document.getElementById('sendChat'),
  attachPreview: document.getElementById('attachPreview')
};
// file inputs
const photoInput = document.getElementById("photoInput");
const fileInput = document.getElementById("fileInput");
const attachPlusBtn = document.getElementById("attachPlusBtn");
const attachMenu = document.getElementById("attachMenu");
const menuPhoto = document.getElementById("menuPhoto");
const menuFile = document.getElementById("menuFile");
let pendingImages = [];
let pendingFiles = [];
// open / close chat panel
function openAiPanel(){
  el.aiPanel.classList.add('open');
  el.aiPanel.setAttribute('aria-hidden','false');
  el.aiLauncher.classList.add('hidden');
  setTimeout(()=>{ el.chatInput.focus(); },120);
}
function closeAiPanel(){
  el.aiPanel.classList.remove('open');
  el.aiPanel.setAttribute('aria-hidden','true');
  el.aiLauncher.classList.remove('hidden');
}
el.aiLauncher.addEventListener('click', openAiPanel);
el.aiClose.addEventListener('click', closeAiPanel);
// plus button dropdown menu toggle
attachPlusBtn.addEventListener("click", (e)=>{
  e.stopPropagation();
  attachMenu.classList.toggle("show");
});
// click outside close menu
document.addEventListener("click", ()=>{ attachMenu.classList.remove("show"); });
menuPhoto.addEventListener("click",(e)=>{
  e.stopPropagation(); attachMenu.classList.remove("show"); photoInput.click();
});
menuFile.addEventListener("click",(e)=>{
  e.stopPropagation(); attachMenu.classList.remove("show"); fileInput.click();
});
function escHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function renderAttachPreview(){
  el.attachPreview.innerHTML = "";
  pendingImages.forEach((img,idx)=>{
    const chip = document.createElement("span"); chip.className="attach-chip";
    chip.innerHTML = <img src="${img.dataUrl}" alt="preview" /><span>${escHtml(img.name)}</span>;
    const rmBtn = document.createElement("button"); rmBtn.textContent="×";
    rmBtn.onclick = ()=>{ pendingImages.splice(idx,1); renderAttachPreview(); };
    chip.appendChild(rmBtn); el.attachPreview.appendChild(chip);
  });
  pendingFiles.forEach((f,idx)=>{
    const chip = document.createElement("span"); chip.className="attach-chip";
    chip.innerHTML = <span>📄 ${escHtml(f.name)}</span>`;
    const rmBtn = document.createElement("button"); rmBtn.textContent="×";
    rmBtn.onclick = ()=>{ pendingFiles.splice(idx,1); renderAttachPreview(); };
    chip.appendChild(rmBtn); el.attachPreview.appendChild(chip);
  });
}
async function readFileAsDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
photoInput.onchange = async function(){
  const files = Array.from(this.files||[]);
  for(let f of files){
    if(!f.type.startsWith("image/")) continue;
    const dataUrl = await readFileAsDataUrl(f);
    pendingImages.push({dataUrl:dataUrl,name:f.name,mime:f.type});
  }
  this.value = ""; renderAttachPreview();
};
fileInput.onchange = async function(){
  const files = Array.from(this.files||[]);
  for(let f of files){
    if(f.type.startsWith("image/")){
      const dataUrl = await readFileAsDataUrl(f);
      pendingImages.push({dataUrl:dataUrl,name:f.name,mime:f.type});
    }else{
      pendingFiles.push({name:f.name});
    }
  }
  this.value = ""; renderAttachPreview();
};
function scrollChatBottom(){
  requestAnimationFrame(()=>{
    el.chatLog.scrollTop = el.chatLog.scrollHeight;
    setTimeout(()=>{ el.chatLog.scrollTop = el.chatLog.scrollHeight; },80);
  });
}
function addUserMessage(text){
  const wrap = document.createElement("div"); wrap.className="msg user";
  let html = "";
  if(text) html += <div>${escHtml(text).replace(/\n/g,"<br>")}</div>;
  pendingImages.forEach(img=>{
    html += <div style="margin-top:8px"><img src="${img.dataUrl}" style="max‑width:100%;max‑height:180px;border‑radius:8px;border:1px solid #00000012" /></div>;
  });
  pendingFiles.forEach(f=>{
    html += <div style="margin‑top:6px;font‑size:0.82rem;opacity:0.8">📄 ${escHtml(f.name)}</div>;
  });
  if(!html) html = "<em>(image / file only)</em>";
  wrap.innerHTML = html;
  el.chatLog.appendChild(wrap);
  scrollChatBottom();
}
function addBotMessage(text){
  const wrap = document.createElement("div"); wrap.className="msg bot";
  wrap.innerHTML = escHtml(text).replace(/\n/g,"<br>");
  el.chatLog.appendChild(wrap);
  scrollChatBottom();
}
async function handleSend(){
  const userText = el.chatInput.value.trim();
  if(!userText && pendingImages.length===0 && pendingFiles.length===0) return;
  const snapImages = [...pendingImages];
  const snapFiles = [...pendingFiles];
  addUserMessage(userText);
  el.chatInput.value = "";
  pendingImages = []; pendingFiles = [];
  renderAttachPreview();
  // typing indicator
  const typing = document.createElement("div");
  typing.className="msg bot";
  typing.textContent = "Mr. Effie is thinking...";
  typing.style.opacity = "0.7";
  el.chatLog.appendChild(typing);
  scrollChatBottom();
  try{
    const parts = [];
    parts.push({text: SYSTEM_PROMPT + "\nStudent input: " + userText});
    for(const img of snapImages){
      const b64 = img.dataUrl.split(",")[1];
      parts.push({ inline_data: { mime_type: img.mime, data:b64 }});
    }
    const payload = { contents:[ { parts: parts } ] };
    const res = await fetch(API_URL,{
      method:"POST",
      headers:{"Content‑Type":"application/json"},
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    typing.remove();
    const reply = json?.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!reply){
      addBotMessage("Sorry, I could not generate a reply. Check API‑key, Generative‑Language‑API permission and CORS browser restrictions.");
    }else{
      addBotMessage(reply);
    }
  }catch(err){
    typing.remove();
    addBotMessage(Request error: ${err.message}\nMost‑likely‑cause: browser CORS blocks Gemini request when opening local html file.);
  }
}
// bind events
el.sendChat.onclick = handleSend;
el.chatInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter") handleSend(); });
// suggestion quick buttons
document.querySelectorAll(".suggestions button").forEach(btn=>{
  const clone = btn.cloneNode(true);
  btn.parentNode.replaceChild(clone,btn);
  clone.addEventListener("click",()=>{
    el.chatInput.value = clone.dataset.prompt;
    handleSend();
  });
});
// welcome greeting message on load
setTimeout(()=>{
  addBotMessage("Hi! I am Mr. Effie.\nFeel free to ask me mathematics questions. You may also attach photos or files.");
},400);
console.log("Mr.Effie chatbox loaded (local test mode, Gemini 1.5 Flash)");
</script>
</body>
</html>
