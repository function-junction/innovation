<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ms. Effie — AI Marking Assistant (a–o)</title>
<style>
/* ai-assistant core styles - English only comments */
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh}
body{
  color:#102033;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 14% 12%, rgba(255,218,126,0.46), transparent 26rem),
    radial-gradient(circle at 86% 10%, rgba(118,216,255,0.34), transparent 24rem),
    radial-gradient(circle at 88% 72%, rgba(255,139,158,0.25), transparent 26rem),
    linear-gradient(125deg, #eafff8 0%, #fff5bf 32%, #eaf2ff 66%, #ffe9ef 100%);
  display:grid;
  place-items:center;
  padding:18px;
}
a{color:#0d6571}
.page-head{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:2}
.page-head a{font-weight:800;text-decoration:none;background:rgba(255,255,255,0.9);border:1px solid rgba(16,32,51,0.12);padding:8px 12px;border-radius:10px}
.page-head span{font-weight:700;color:#304a63;background:rgba(255,255,255,0.86);padding:8px 12px;border-radius:10px;border:1px solid rgba(16,32,51,0.08)}
/* Launcher and panel - original positions */
.ai-launcher{
  position:fixed;right:max(18px, env(safe-area-inset-right));bottom:max(18px, env(safe-area-inset-bottom));
  z-index:20;display:flex;align-items:end;gap:10px;min-width:78px;min-height:78px;background:transparent;border:0;cursor:pointer;
}
.ai-launcher.hidden{opacity:0;transform:translateY(12px);pointer-events:none}
.ai-launcher-bubble{padding:11px 14px;border-radius:18px 18px 4px 18px;background:rgba(255,255,255,0.94);color:#354052;box-shadow:0 12px 30px rgba(74,21,51,0.18);font-weight:800;border:1px solid rgba(140,16,75,0.12)}
.ai-launcher-avatar{width:clamp(76px,5.2vw,94px);height:clamp(76px,5.2vw,94px);border-radius:50%;overflow:hidden;background:#ffe2ef;border:6px solid rgba(255,224,237,0.9);box-shadow:0 16px 36px rgba(74,21,51,0.26)}
.ai-launcher-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.ai-panel{
  position:fixed;right:22px;bottom:22px;z-index:21;
  width:min(480px, 96vw);
  max-height:min(820px, 92vh);
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto auto auto auto;
  overflow:hidden;
  border-radius:24px;
  background:#f7fbff;
  border:1px solid rgba(0,120,160,0.22);
  box-shadow:0 24px 60px rgba(16,47,74,0.26);
  opacity:0;pointer-events:none;transform:translateY(18px) scale(0.98);transition:opacity 0.22s ease, transform 0.22s ease;
}
.ai-panel.open{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.ai-panel::before{
  content:"y=e^{x}   f(x)   sin x   log_a x   x^{2}";
  position:absolute;inset:102px 0 auto;height:64px;pointer-events:none;
  color:rgba(17,78,110,0.07);font-family:Georgia,serif;font-size:1.28rem;font-weight:900;letter-spacing:0.04em;transform:rotate(-6deg);white-space:nowrap;z-index:0;
}
.ai-header{
  min-height:90px;padding:12px 14px;display:flex;align-items:center;gap:12px;
  background:radial-gradient(circle at 88% 18%, rgba(255,211,105,0.42), transparent 22%), linear-gradient(135deg, #0d4265, #069aa6 58%, #37b48b);
  color:#fff;position:relative;z-index:1;
}
.ai-avatar{width:68px;height:68px;border-radius:16px;overflow:hidden;background:#eefcff;border:2px solid rgba(255,255,255,0.72);flex:0 0 auto;box-shadow:0 6px 14px rgba(3,42,67,0.18);position:absolute;top:14px;left:14px;z-index:2}
.ai-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.ai-header-content{margin-left:84px;flex:1;padding-right:50px}
.ai-header h3{margin:0;font-size:1.16rem;line-height:1.05;font-weight:950}
.ai-header p{margin:4px 0 0;color:rgba(255,255,255,0.92);font-size:0.9rem;font-weight:700}
.ai-badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;margin-left:5px;padding:0 6px;border-radius:7px;background:rgba(255,211,105,0.26);font-size:0.78rem;font-weight:950}
.ai-close{position:absolute;top:14px;right:14px;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,0.88);color:#0d4265;font-size:1.8rem;line-height:1;font-weight:700;border:0;cursor:pointer;z-index:3}
.chat-log{
  min-height:260px;overflow-y:auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:12px;
  background:linear-gradient(rgba(9,92,128,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(9,92,128,0.045) 1px, transparent 1px), linear-gradient(180deg, #f7fbff, #effcff);
  background-size:22px 22px,22px 22px,auto;color:#11364e;position:relative;z-index:1;
}
.msg{max-width:92%;padding:11px 13px;border-radius:15px;line-height:1.55;font-size:0.98rem;overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,0.76);border:1px solid rgba(6,154,166,0.14);color:#123852;box-shadow:0 8px 18px rgba(17,54,78,0.06)}
.msg.user{align-self:flex-end;background:linear-gradient(135deg, #d9f6ef, #c8ecff);color:#0e3c58;border:1px solid rgba(55,180,139,0.24)}
.chat-controls{margin:0 16px 16px;padding:10px;display:grid;grid-template-columns:auto auto 1fr 46px;gap:8px;background:#e3f5f7;border-radius:14px;border:1px solid rgba(6,154,166,0.18);position:relative;z-index:1}
.chat-controls input{min-width:0;border:0;border-radius:10px;padding:0 12px;color:#11364e;background:transparent;font-size:1rem;outline:none}
.chat-controls input::placeholder{color:rgba(17,54,78,0.55)}
#sendChat{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg, #0d72ff, #05a8a8);color:#fff;font-size:1.3rem;border:0;cursor:pointer}
.suggestions{padding:0 16px 12px;display:flex;gap:7px;flex-wrap:wrap;background:#f7fbff;position:relative;z-index:1}
.suggestions button{background:rgba(230,250,247,0.86);color:#0d6571;border:1px solid rgba(6,154,166,0.18);border-radius:999px;padding:7px 9px;font-size:0.78rem;font-weight:800;cursor:pointer}
.ai-tabs{display:grid;grid-template-columns:1fr;min-height:48px;background:#f7fbff;border-top:1px solid rgba(6,154,166,0.18);position:relative;z-index:1}
.ai-tab{display:flex;align-items:center;justify-content:center;gap:8px;color:rgba(17,54,78,0.64);font-weight:800;background:transparent;border:0;border-top:2px solid transparent}
.ai-tab.active{color:#0d6571;border-top-color:#05a8a8}
.chat-icon{width:24px;height:20px;display:inline-block;position:relative;border:2px solid currentColor;border-radius:7px;background:rgba(255,255,255,0.66)}
.chat-icon::after{content:"";position:absolute;left:5px;bottom:-7px;width:8px;height:8px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;background:#f7fbff;transform:skew(-18deg)}
.chat-icon::before{content:"fx";position:absolute;inset:0;display:grid;place-items:center;font-size:0.58rem;line-height:1;font-weight:950}
.ai-powered{min-height:34px;display:grid;place-items:center;background:linear-gradient(90deg, #eefcff, #f8fbff);color:#557084;font-size:0.78rem;font-weight:800;position:relative;z-index:1}
.ai-config{padding:10px 16px;display:grid;gap:8px;background:#f7fbff;border-bottom:1px solid rgba(6,154,166,0.12);position:relative;z-index:1}
.ai-config-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ai-config label{font-size:0.76rem;font-weight:800;color:#0d6571;white-space:nowrap}
.ai-config input[type="password"],.ai-config select{flex:1;min-width:120px;height:32px;border-radius:8px;border:1px solid rgba(6,154,166,0.22);padding:0 8px;font-size:0.84rem;background:#fff;color:#11364e}
.ai-config button.tiny{height:32px;padding:0 10px;border-radius:8px;font-size:0.76rem;font-weight:800;background:#0d6571;color:#fff;border:0;cursor:pointer}
.ai-config .hint{font-size:0.72rem;color:#557084;line-height:1.35}
.attach-preview{padding:0 16px;display:flex;flex-wrap:wrap;gap:8px;background:#f7fbff;position:relative;z-index:1}
.attach-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:999px;background:#e3f5f7;border:1px solid rgba(6,154,166,0.18);font-size:0.74rem;font-weight:700;color:#0d4265;max-width:180px;overflow:hidden}
.attach-chip img{width:28px;height:28px;object-fit:cover;border-radius:6px;border:1px solid rgba(0,0,0,0.08)}
.attach-chip button{width:18px;height:18px;border-radius:50%;background:#0d4265;color:#fff;font-size:0.7rem;display:grid;place-items:center;border:0;flex:0 0 auto;cursor:pointer}
.icon-btn-attach{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#fff;border:1px solid rgba(6,154,166,0.18);color:#0d6571;font-size:1.05rem;flex:0 0 auto;cursor:pointer}
.msg .mark-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:0.86rem}
.msg .mark-table th,.msg .mark-table td{border:1px solid rgba(6,154,166,0.18);padding:6px 7px;text-align:left}
.msg .mark-table th{background:#e3f5f7;color:#0d4265;font-weight:800}
.msg .badge-ok{color:#0a7a42;font-weight:800}.msg .badge-wrong{color:#c0392b;font-weight:800}.msg .badge-partial{color:#b7791f;font-weight:800}
.chat-log.drag-over{outline:2px dashed #05a8a8;outline-offset:-6px;background-color:rgba(5,168,168,0.06)}
/* Embed mode for iframe */
body.embed{background:transparent;padding:0;display:block}
body.embed .page-head{display:none}
body.embed .ai-launcher{display:none !important}
body.embed .ai-panel{position:relative;right:auto;bottom:auto;width:100%;max-width:100%;max-height:100vh;height:100vh;height:100dvh;border-radius:16px;box-shadow:none;margin:0}
@media(max-width:560px){.page-head{position:static;margin-bottom:12px} body{place-items:start center}}
</style>
</head>

<script>
// Embed detection - hide outer chrome when loaded in index.html iframe
(function(){
  try{
    const params=new URLSearchParams(location.search);
    if(params.get("embed")==="1"){
      document.body.classList.add("embed");
      document.documentElement.classList.add("embed");
      document.addEventListener("DOMContentLoaded",()=>{
        const panel=document.getElementById("aiPanel");
        if(panel){ panel.classList.add("open"); panel.setAttribute("aria-hidden","false"); }
      });
      document.addEventListener("DOMContentLoaded",()=>{
        const closeBtn=document.getElementById("aiClose");
        if(closeBtn){ closeBtn.addEventListener("click",()=>{ try{ parent.postMessage({type:"fj-close-ai"}, "*"); }catch(e){} }); }
      });
    }
  }catch(e){}
})();
</script>

<script>
// Minimal shims for standalone - provide fallback helpers
window.formatMathHTML = window.formatMathHTML || function(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); };
window.speak = window.speak || function(){};
window.el = {
  aiPanel: document.getElementById('aiPanel'),
  aiLauncher: document.getElementById('aiLauncher'),
  aiClose: document.getElementById('aiClose'),
  chatLog: document.getElementById('chatLog'),
  chatInput: document.getElementById('chatInput'),
  sendChat: document.getElementById('sendChat')
};
function openAiPanel(){ el.aiPanel.classList.add('open'); el.aiPanel.setAttribute('aria-hidden','false'); el.aiLauncher.classList.add('hidden'); setTimeout(function(){ el.chatInput.focus(); },120); }
function closeAiPanel(){ el.aiPanel.classList.remove('open'); el.aiPanel.setAttribute('aria-hidden','true'); el.aiLauncher.classList.remove('hidden'); }
document.getElementById('aiLauncher').addEventListener('click', openAiPanel);
document.getElementById('aiClose').addEventListener('click', closeAiPanel);
</script>

    function fileToDataUrl(file) {
      return new Promise(function (resolve, reject) {
        const r = new FileReader();
        r.onload = function () { resolve(r.result); };
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    // Math-specific image preprocessing for better handwriting recognition
    function preprocessMathImage(dataUrl) {
      return new Promise(function (resolve) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          
          // Set reasonable size for processing (max 1200px width)
          const maxWidth = 1200;
          const scale = Math.min(1, maxWidth / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          
          // Draw image with enhanced contrast for handwriting
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          // Apply contrast enhancement for better math symbol recognition
          try {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
              // Enhance contrast for better handwriting recognition
              const factor = 1.2; // contrast factor
              const intercept = 128 * (1 - factor);
              
              data[i] = data[i] * factor + intercept;     // R
              data[i + 1] = data[i + 1] * factor + intercept; // G
              data[i + 2] = data[i + 2] * factor + intercept; // B
            }
            
            ctx.putImageData(imageData, 0, 0);
          } catch (e) {
            // If canvas manipulation fails, use original
            console.log('Image preprocessing skipped:', e.message);
          }
          
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = function () { resolve(dataUrl); }; // fallback to original
        img.src = dataUrl;
      });
    }

    function fileToTextSnippet(file) {
      return new Promise(function (resolve) {
        if (file.type.startsWith("image/")) { resolve(""); return; }
        const r = new FileReader();
        r.onload = function () { resolve(String(r.result).slice(0, 6000)); };
        r.onerror = function () { resolve(""); };
        
        // Enhanced PDF handling for marking schemes
        if (file.type === "application/pdf") {
          // Check if it's likely a marking scheme by filename
          const isMarkingScheme = /scheme|marking|rubric|answer|key|solution/i.test(file.name);
          if (isMarkingScheme) {
            resolve("[MARKING SCHEME PDF: " + file.name + " - This appears to be a marking scheme document. The AI will use this for grading standards.]");
          } else {
            resolve("[PDF file: " + file.name + " - Content will be analyzed for math content]");
          }
          return;
        }
        
        // Check for common math document formats
        if (file.name.match(/\.(tex|latex|math)$/i)) {
          resolve("[LATEX MATH FILE: " + file.name + " - Mathematical notation detected]");
          return;
        }
        
        r.readAsText(file);
      });

    function offlineHintReply(text) {

    function getDetailedHint(scheme) {
      const hints = {
        constant: "For constant functions f(x) = k:\n🔹 Graph is a horizontal line at y = k\n🔹 Domain: All real numbers (-∞, ∞)\n🔹 Range: Just the single value {k}\n\nMake sure your line is perfectly horizontal!",
        linear: "For linear functions f(x) = ax + b:\n🔹 Gradient = a (positive = increasing, negative = decreasing)\n🔹 y-intercept: set x = 0 → (0, b)\n🔹 x-intercept: set y = 0 → x = -b/a\n🔹 Domain & Range: Both (-∞, ∞)\n\nThe gradient tells you everything about the line's direction!",
        quadratic: "For quadratic functions f(x) = ax² + bx + c:\n🔹 Shape: Parabola (U if a > 0, inverted if a < 0)\n🔹 Vertex: Complete the square or use x = -b/(2a)\n🔹 Domain: Always (-∞, ∞)\n🔹 Range: From vertex y-value (inclusive) upward or downward\n\nThe vertex is the most important point!",
        cubic: "For cubic functions f(x) = ax³ + bx² + cx + d:\n🔹 Shape: S-shaped curve\n🔹 Point of inflection: Where curvature changes\n🔹 Domain & Range: Both (-∞, ∞)\n🔹 Always passes through all y-values\n\nCubics are smooth curves with no breaks!",
        absolute: "For absolute functions f(x) = |ax + b| + c:\n🔹 Shape: V-shape\n🔹 Vertex: Solve ax + b = 0 → x = -b/a\n🔹 y-value at vertex: c\n🔹 Domain: (-∞, ∞)\n🔹 Range: [c, ∞) if opening upward\n\nThe vertex is the sharp corner of the V!",
        surd: "For square root functions f(x) = √(ax + b):\n🔹 Domain: Solve ax + b ≥ 0\n🔹 Starting point: Where inside = 0\n🔹 Range: Always [0, ∞)\n🔹 Shape: Half-parabola opening to the right\n\nThe inside of the square root must never be negative!",
        rational: "For rational functions f(x) = (ax + b)/(cx + d):\n🔹 Vertical asymptote: Set denominator = 0 → x = -d/c\n🔹 Horizontal asymptote: Compare degrees of numerator/denominator\n🔹 Domain: All real except where denominator = 0\n🔹 Range: All real except horizontal asymptote value\n\nAsymptotes are the key to understanding rational functions!",
        exponential: "For exponential functions f(x) = a^(bx) + c:\n🔹 Horizontal asymptote: y = c\n🔹 y-intercept: Set x = 0 → f(0) = a^0 + c = 1 + c\n🔹 Domain: (-∞, ∞)\n🔹 Range: (c, ∞) if a > 1\n\nExponential functions grow or decay very quickly!",
        logarithmic: "For logarithmic functions f(x) = log(ax + b) + c:\n🔹 Vertical asymptote: Set ax + b = 0 → x = -b/a\n🔹 Domain: Solve ax + b > 0\n🔹 Range: (-∞, ∞)\n🔹 x-intercept: Set log(ax + b) + c = 0\n\nLogarithms are the inverse of exponentials!"

    function getSchemeForInput(text) {
      // Config now in index.html, use localStorage for scheme selection
      const sel = (localStorage.getItem("fj_scheme_pick") || "").toLowerCase();
      if (sel && MARKING_SCHEME[sel]) return MARKING_SCHEME[sel];
      const q = (text || "").toLowerCase();
      // crude detect: look for (a)-(o) or function string
      for (const k in MARKING_SCHEME) {
        const s = MARKING_SCHEME[k];
        // if student mentions the exact question snippet
        if (q.includes(s.question.toLowerCase().replace(/\s+/g, "")) || q.includes("(" + k + ")")) return s;
      }
      // try to detect by type keywords
      if (q.includes("sqrt") || q.includes("√")) {
        if (q.includes("3x-2")) return MARKING_SCHEME.h;
        if (q.includes("2-3x")) return MARKING_SCHEME.i;
      }
      if (q.includes("5/") || q.includes("5 ")) {
        if (q.includes("2+x") || q.includes("2 + x")) return MARKING_SCHEME.j;
        if (q.includes("2-x") || q.includes("2 - x")) return MARKING_SCHEME.k;
      }
      // Try to generate dynamic scheme if function detected
      const dynamicScheme = generateDynamicScheme(text);
      if (dynamicScheme) return dynamicScheme;
      
      return null;
    }

    // Dynamic scheme generation for new questions
    function generateDynamicScheme(text) {
      const q = (text || "").toLowerCase();
      let detectedType = null;
      let functionForm = "";
      
      // Detect function type
      if (q.match(/\^2|squared|x²|x\^2/)) {
        detectedType = "quadratic";
        functionForm = "f(x) = ax² + bx + c";
      } else if (q.match(/\^3|cubed|x³|x\^3/)) {
        detectedType = "cubic";
        functionForm = "f(x) = ax³ + bx² + cx + d";
      } else if (q.match(/\||absolute/)) {
        detectedType = "absolute";
        functionForm = "f(x) = |ax + b| + c";
      } else if (q.match(/sqrt|√|surd/)) {
        detectedType = "surd";
        functionForm = "f(x) = √(ax + b)";
      } else if (q.match(/\//) && !q.match(/sqrt|√/)) {
        detectedType = "rational";
        functionForm = "f(x) = (ax + b)/(cx + d)";
      } else if (q.match(/e\^|exp|exponential/)) {
        detectedType = "exponential";
        functionForm = "f(x) = a^(bx) + c";
      } else if (q.match(/ln|log|logarithm/)) {
        detectedType = "logarithmic";
        functionForm = "f(x) = log(ax + b) + c";
      } else if (q.match(/= -?\d+\s*$/)) {
        detectedType = "constant";
        functionForm = "f(x) = k";
      } else if (q.match(/= -?\d*x\s*[+-]\s*\d+/)) {
        detectedType = "linear";
        functionForm = "f(x) = ax + b";
      }
      
      if (detectedType && FUNCTION_TEMPLATES[detectedType]) {
        const template = FUNCTION_TEMPLATES[detectedType];
        return {
          id: "dynamic",
          question: functionForm,
          marks: template.marks,
          type: detectedType,
          expected: {
            graph: template.graph,
            domain: template.domain,
            range: template.range
          },
          breakdown: template.breakdown,
          isDynamic: true,
          commonErrors: []
        };
      }
      
      return null;
    }

    async function callOpenAI(text) {
      const key = (localStorage.getItem("fj_openai_key") || "").trim();
      if (!key) return null;
      const scheme = getSchemeForInput(text);
      const schemeNote = scheme ? "Student is asking about question (" + scheme.id + ") " + scheme.question + ". Use this scheme entry for marking." : "Auto-detect the question (a-o).";
      const userContent = [];
      const combinedText = [
        text || "(no typed text — please read the attached image/handwriting)",
        schemeNote,
        pendingFiles.length ? "Attached files: " + pendingFiles.map(function (f) { return f.name + ": " + f.textSnippet; }).join(" | ") : ""
      ].filter(Boolean).join("\n\n");

      userContent.push({ type: "text", text: combinedText });
      pendingImages.forEach(function (img) {
        userContent.push({ type: "image_url", image_url: { url: img.dataUrl, detail: "high" } });
      });

      const body = {
        model: "gpt-4o",
        temperature: 0.3,
        max_tokens: 900,
        messages: [
          { role: "system", content: buildSystemPrompt() },
          { role: "user", content: userContent }
        ]
      };

      const res = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const err = await res.text();
        throw new Error("OpenAI " + res.status + ": " + err.slice(0, 400));
      }
      const data = await res.json();
      return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
    }

    // Math-focused upload validation and error detection
    function validateMathUploads(images, files, text) {
      const warnings = [];
      const errors = [];
      
      // Check for potential issues
      if (images.length === 0 && files.length === 0 && !text.trim()) {
        errors.push("Please provide at least some text, an image, or a file to grade.");
      }
      
      // Validate image types
      images.forEach(function (img) {
        if (img.type === 'general_math' && !text.toLowerCase().includes('graph') && !text.toLowerCase().includes('function')) {
          warnings.push("Image '" + img.name + "' appears to be general content. For math grading, please upload graphs, handwritten work, or question papers.");
        }
      });
      
      // Check for marking scheme conflicts
      const hasMarkingScheme = files.some(function (f) { return f.isMarkingScheme; });
      if (hasMarkingScheme && !text.toLowerCase().includes('scheme') && !text.toLowerCase().includes('marking')) {
        warnings.push("You uploaded a marking scheme file. Make sure you want to use this as the grading standard, or remove it if you're submitting student work.");
      }
      
      // Check for mixed content types
      const hasGraphs = images.some(function (img) { return img.type === 'graph'; });
      const hasHandwritten = images.some(function (img) { return img.type === 'handwritten_work'; });
      
      if (hasGraphs && hasHandwritten && !text) {
        warnings.push("You uploaded both graphs and handwritten work. Please specify which one you want me to grade, or provide context in your text.");
      }
      
      return { warnings: warnings, errors: errors, isValid: errors.length === 0 };
    }

    function offlineSchemeHint(scheme, text, hasImage) {

      // Show one or two hints, not all
      html += hintPool.slice(0,2).join("<br>") + "<br><br><em>Next:</em> Fix only the ✗/○ parts and resend your updated Df/Rf or a clearer photo.";
      return html;
    }

    newSendBtn.addEventListener("click", handleSend);
    newInput.addEventListener("keydown", function (e) { if (e.key === "Enter") handleSend(); });

    document.querySelectorAll(".suggestions button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        window.el.chatInput.value = btn.dataset.prompt;
        handleSend();
      });
    });
